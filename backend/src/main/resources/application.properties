server.port=${SERVER_PORT:8080}

spring.application.name=polar-command

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:polar_command}
spring.datasource.username=${DB_USER:polar_admin}
spring.datasource.password=${DB_PASSWORD:polar_dev_pw_2027}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET:this-is-a-dev-only-secret-key-change-in-production-min-256-bits}
app.jwt.access-token-expiry-ms=${JWT_ACCESS_EXPIRY_MS:3600000}
app.jwt.refresh-token-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

logging.level.com.ncpor.polarcommand=DEBUG